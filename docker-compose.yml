version: '3.8'

services:
  # Servidor de Desenvolvimento (Hot reload habilitado)
  app-dev:
    image: node:18-alpine
    container_name: pmo-app-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - PORT=3000
      - WATCHPACK_POLLING=true # Garante funcionamento de hot reload no Docker

  # Servidor de Produção (Imagem otimizada com Dockerfile)
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmo-app-prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
